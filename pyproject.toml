[project]
name = "bioflow-sim"
version = "0.2.0"
description = "Deterministic, reference-driven sequencing fixtures for BioFlowAI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1,<9",
    "loguru>=0.7,<1",
]

[project.scripts]
bioflow-sim = "bioflow_sim.cli:cli"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=8.3,<9",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
