[workspace]
authors = ["Aye10032 <yeyu@qibebt.ac.cn>"]
channels = ["conda-forge", "bioconda"]
name = "other_scripts"
platforms = ["linux-64"]
version = "0.1.0"

[pypi-options]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"


[tasks]
upstream = "bash generate_upstream.sh"
reference = "bash generate_upstream.sh --phase reference"
wgs = "bash generate_upstream.sh --phase wgs"
rna = "bash generate_upstream.sh --phase rna"
scrna = "bash generate_upstream.sh --phase scrna"
chromatin = "bash generate_upstream.sh --phase chromatin"
hic = "bash generate_upstream.sh --phase hic"
methylation = "bash generate_upstream.sh --phase methylation"
somatic = "bash generate_upstream.sh --phase somatic"
all = "bash generate_upstream.sh --phase all"

[dependencies]
bwa = ">=0.7.19,<0.8"
minimap2 = ">=2.31,<3"
samtools = ">=1.24,<2"
bcftools = ">=1.24,<2"
htslib = ">=1.24,<2"
gatk4 = ">=4.6.2.0,<5"
star = ">=2.7.10b,<3"
macs3 = ">=3.0.4,<4"
bedtools = ">=2.31.1,<3"
pairtools = ">=1.1.3,<2"
pairix = ">=0.3.9,<0.4"
cooler = ">=0.10.4,<0.11"
bismark = ">=3.1.0,<4"
bowtie2 = ">=2.5.5,<3"
openjdk = "17.*"
python = "3.11.*"
