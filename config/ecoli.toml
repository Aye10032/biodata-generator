version = 2
workspace_root = "../.."
publish = "files-only"

[defaults]
seed = 114514

[cases.illumina_se]
simulator = "dna"
[cases.illumina_se.parameters]
reference = "Ecoli/reference/GCF_000005845.2_ASM584v2_genomic.fna"
output_dir = "Ecoli/wgs/illumina_se"
sample = "ECOLI_SE"
technology_name = "illumina-se"
reads = 200
read_length = 150
fragment_mean = 350
fragment_sd = 35
long_read_mean = 8000
long_read_sd = 3000
snvs = 10

[cases.illumina_pe]
simulator = "dna"
[cases.illumina_pe.parameters]
reference = "Ecoli/reference/GCF_000005845.2_ASM584v2_genomic.fna"
