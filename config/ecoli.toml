[cases.bulk_rna]
simulator = "bulk-rna"
[cases.bulk_rna.parameters]
transcripts_path = "Ecoli/reference/cds_from_genomic.fna"
annotation_path = "Ecoli/reference/genomic.gtf"
output_dir = "Ecoli/rna-seq/illumina_pe"
sample_prefix = "ECOLI_RNA"
samples_per_group = 1
reads_per_sample = 200
layout = "pe"
strandedness = "forward"
read_length = 100
fragment_mean = 250
fragment_sd = 35
fold_change = 4.0

[cases.hic]
simulator = "hic"
[cases.hic.parameters]
reference = "Ecoli/reference/GCF_000005845.2_ASM584v2_genomic.fna"
output_dir = "Ecoli/Hi-C/mboi"
sample = "ECOLI_HIC"
enzyme_name = "mboi"
reads = 100
read_length = 100
intra_rate = 1.0
mean_distance = 20000
