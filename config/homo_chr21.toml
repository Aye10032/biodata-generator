version = 2
workspace_root = "../.."

[defaults]
seed = 114514

[cases.illumina_se]
simulator = "dna"
[cases.illumina_se.parameters]
reference = "Homo_chr21/reference/genome.fa"
output_dir = "Homo_chr21/wgs/illumina_se"
sample = "H21_SE"
technology_name = "illumina-se"
reads = 200
read_length = 150
fragment_mean = 350
fragment_sd = 35
long_read_mean = 12000
long_read_sd = 4000
snvs = 20

